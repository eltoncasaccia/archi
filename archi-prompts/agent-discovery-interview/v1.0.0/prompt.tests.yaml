cases:
  - name: teste_basico_com_contexto_inicial
    inputs:
      contexto_inicial: "Cliente é uma ONG que trabalha com assistência social e precisa de um sistema para gerenciar atendimentos."
    expect_contains:
      - "especialista em levantamento de requisitos"
      - "entrevista consultiva"
      - "Cliente é uma ONG que trabalha com assistência social"
      - "Contexto disponível antes da conversa"
      - "O que você precisa descobrir"
      - "[DISCOVERY_APROVADO]"
      - "Regras de comportamento"

  - name: teste_sem_contexto_inicial
    inputs:
      contexto_inicial: "Nenhum contexto fornecido previamente."
    expect_contains:
      - "especialista em levantamento de requisitos"
      - "Nenhum contexto fornecido previamente"
      # O teste afirmava "no máximo 2 perguntas" — o oposto do que o prompt manda.
      # Quem rodasse o eval sem ler seria levado a "consertar" o prompt errado.
      - "Faça exatamente 1 pergunta por mensagem"
      - "Não demonstre surpresa, julgamento ou opinião"
      - "empresa:"
      - "setor:"
      - "problema_central:"
      - "funcionalidades_solicitadas:"
