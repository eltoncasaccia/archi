<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Archi — Marca</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="tokens.css" />
  <style>
    html, body, #root { height: 100%; margin: 0; }
    body { background: #efe9da; font-family: "Geist", system-ui, sans-serif; }

    .swatch-board {
      width: 100%; height: 100%;
      background: var(--paper);
      padding: 36px 40px;
      box-sizing: border-box;
      display: flex; flex-direction: column; gap: 28px;
      overflow: hidden;
    }
    .swatch-board.dark { background: var(--ink); color: var(--paper); }

    .eyebrow-card {
      font-family: "Geist Mono", monospace;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-size: 11px;
      color: var(--muted);
      font-weight: 500;
    }
    .swatch-board.dark .eyebrow-card { color: #948a7d; }

    .scale-row {
      display: flex; align-items: flex-end; gap: 36px;
      padding: 24px 28px;
      border: 1px solid var(--rule);
      background: var(--paper);
    }
    .swatch-board.dark .scale-row {
      background: var(--ink);
      border-color: rgba(255,255,255,0.12);
    }

    .scale-cell { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .scale-cell .px {
      font-family: "Geist Mono", monospace;
      font-size: 11px;
      color: var(--muted);
    }
    .swatch-board.dark .scale-cell .px { color: #948a7d; }

    .options-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px;
      background: var(--rule);
      border: 1px solid var(--rule);
    }
    .option-cell {
      background: var(--paper);
      padding: 28px 24px 22px;
      display: flex; flex-direction: column; align-items: center;
      gap: 16px;
    }
    .option-cell .label-row {
      width: 100%;
      display: flex; justify-content: space-between; align-items: baseline;
      font-family: "Geist Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .option-cell .name {
      font-family: "Geist", sans-serif;
      font-weight: 500;
      font-size: 13px;
      color: var(--ink);
      letter-spacing: -0.01em;
    }
    .option-cell .selected {
      color: var(--accent);
      text-transform: uppercase;
    }

    .favicon-strip {
      display: flex; gap: 16px; align-items: center;
      padding: 18px 22px;
      border: 1px solid var(--rule);
      background: var(--paper-2);
    }
    .swatch-board.dark .favicon-strip {
      background: rgba(255,255,255,0.04);
      border-color: rgba(255,255,255,0.12);
    }
    .browser-tab {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 12px 6px 8px;
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 6px 6px 0 0;
      font-size: 12px;
      color: var(--ink);
      max-width: 200px;
    }
    .swatch-board.dark .browser-tab {
      background: #2b251d;
      color: var(--paper);
      border-color: rgba(255,255,255,0.15);
    }

    .header-bar {
      display: flex; justify-content: space-between; align-items: flex-end;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--rule);
    }
    .swatch-board.dark .header-bar { border-color: rgba(255,255,255,0.12); }

    .header-bar h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 500;
      letter-spacing: -0.02em;
    }
    .header-bar p {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--muted);
      max-width: 480px;
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="icons/marks.jsx"></script>
  <script type="text/babel" src="icons/wordmark.jsx"></script>

  <script type="text/babel">
    const { DesignCanvas, DCSection, DCArtboard } = window;
    const {
      MarkA, MarkB, MarkC, MarkD, MarkE, MarkF, MarkPrimary, Wordmark,
    } = window;

    const options = [
      { id: "primary", name: "Primary · Speech bubble + pip", code: "A.0", Mark: MarkPrimary, selected: true },
      { id: "a",       name: "Discovery tally",                code: "A.1", Mark: MarkA },
      { id: "b",       name: "Ledger O",                       code: "A.2", Mark: MarkB },
      { id: "c",       name: "Sliced O · cursor",              code: "A.3", Mark: MarkC },
      { id: "d",       name: "Or · monogram",                  code: "A.4", Mark: MarkD },
      { id: "e",       name: "Document · folded corner",       code: "A.5", Mark: MarkE },
      { id: "f",       name: "Bracket · prompt",               code: "A.6", Mark: MarkF },
    ];

    function PrimaryBoard() {
      return (
        <div className="swatch-board">
          <div className="header-bar">
            <div>
              <div className="eyebrow-card">A · Marca primária</div>
              <h2>Speech bubble + pip laranja.</h2>
              <p>O balão = entrevista. O ponto = o agente. Funciona em escala de favicon (16px) até OOH.</p>
            </div>
            <div className="eyebrow-card">v1.0 · 64×64</div>
          </div>

          <div className="scale-row">
            {[16, 24, 32, 48, 64, 96, 128].map((s) => (
              <div className="scale-cell" key={s}>
                <MarkPrimary size={s} />
                <span className="px">{s}px</span>
              </div>
            ))}
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
            <div className="favicon-strip">
              <span className="eyebrow-card" style={{ minWidth: 60 }}>Favicon</span>
              <div className="browser-tab">
                <MarkPrimary size={14} />
                <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>Archi · Painel</span>
                <span style={{ marginLeft: "auto", color: "var(--muted-2)", fontSize: 14, lineHeight: 0.8 }}>×</span>
              </div>
            </div>
            <div className="favicon-strip">
              <span className="eyebrow-card" style={{ minWidth: 60 }}>Lockup</span>
              <Wordmark scale={0.6} />
            </div>
          </div>
        </div>
      );
    }

    function OptionsBoard({ dark = false }) {
      return (
        <div className={`swatch-board ${dark ? "dark" : ""}`}>
          <div className="header-bar">
            <div>
              <div className="eyebrow-card">B · Explorações</div>
              <h2 style={{ color: dark ? "var(--paper)" : "var(--ink)" }}>
                Sete direções para a marca.
              </h2>
              <p style={{ color: dark ? "#948a7d" : "var(--muted)" }}>
                Mesma paleta, mesmo grid 64×64. Selecione a direção que melhor representa o produto.
              </p>
            </div>
            <div className="eyebrow-card">{dark ? "Sobre tinta" : "Sobre papel"}</div>
          </div>

          <div className="options-grid" style={{
            background: dark ? "rgba(255,255,255,0.10)" : "var(--rule)",
            borderColor: dark ? "rgba(255,255,255,0.10)" : "var(--rule)",
          }}>
            {options.map((opt) => {
              const Mark = opt.Mark;
              return (
                <div className="option-cell" key={opt.id} style={{
                  background: dark ? "var(--ink)" : "var(--paper)",
                }}>
                  <div className="label-row">
                    <span style={{ color: dark ? "#948a7d" : "var(--muted)" }}>{opt.code}</span>
                    {opt.selected && <span className="selected">selecionada</span>}
                  </div>
                  <div style={{
                    padding: 18,
                    background: dark ? "rgba(255,255,255,0.04)" : "var(--paper-2)",
                    border: `1px solid ${dark ? "rgba(255,255,255,0.10)" : "var(--rule)"}`,
                  }}>
                    <Mark size={72}
                      ink={dark ? "var(--paper)" : "var(--ink)"}
                      paper={dark ? "var(--ink)" : "var(--paper)"}
                    />
                  </div>
                  <div className="name" style={{ color: dark ? "var(--paper)" : "var(--ink)", textAlign: "center" }}>
                    {opt.name}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function LockupBoard() {
      return (
        <div className="swatch-board" style={{ display: "grid", gridTemplateRows: "auto 1fr 1fr", gap: 0 }}>
          <div className="header-bar" style={{ marginBottom: 24 }}>
            <div>
              <div className="eyebrow-card">C · Lockup horizontal</div>
              <h2>Archi · marca + tipo.</h2>
              <p>Geist 600, kerning -0.03em. Sufixo "Ai" em laranja queimado para sinalizar a presença do agente sem peso visual.</p>
            </div>
            <div className="eyebrow-card">Geist · 36/56px</div>
          </div>

          <div style={{
            display: "flex", alignItems: "center", justifyContent: "center",
            border: "1px solid var(--rule)", padding: "48px 24px",
            background: "var(--paper)",
          }}>
            <Wordmark scale={1.1} />
          </div>

          <div style={{
            display: "flex", alignItems: "center", justifyContent: "center",
            border: "1px solid var(--rule)", borderTop: 0, padding: "48px 24px",
            background: "var(--ink)",
          }}>
            <Wordmark scale={1.1} dark />
          </div>
        </div>
      );
    }

    function App() {
      return (
        <DesignCanvas>
          <DCSection
            id="primary"
            title="Marca · Archi"
            subtitle="Iconografia em papel quente + tinta + acento laranja queimado. Vocabulário consistente com as 8 telas."
          >
            <DCArtboard id="primary" label="A · Primária + escalas" width={1100} height={720}>
              <PrimaryBoard />
            </DCArtboard>
            <DCArtboard id="lockup" label="C · Lockup" width={780} height={720}>
              <LockupBoard />
            </DCArtboard>
          </DCSection>

          <DCSection
            id="explorations"
            title="Explorações"
            subtitle="Sete leituras possíveis da identidade — todas no mesmo sistema. Útil se você quiser pivotar a direção."
          >
            <DCArtboard id="options-light" label="B · Sobre papel" width={1100} height={720}>
              <OptionsBoard />
            </DCArtboard>
            <DCArtboard id="options-dark" label="B · Sobre tinta" width={1100} height={720}>
              <OptionsBoard dark />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
