<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Archi — Design das telas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="tokens.css" />
  <style>
    html, body, #root { height: 100%; margin: 0; }
    body { background: #efe9da; font-family: "Geist", system-ui, sans-serif; }

    /* dot/spin animations used by chat + doc rows */
    @keyframes oaDot {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30%           { transform: translateY(-3px); opacity: 1; }
    }
    @keyframes oaSpin { to { transform: rotate(360deg); } }

    /* artboard "device" framing */
    .artboard-frame {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--paper);
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>

<body>
  <div id="root"></div>

  <!-- design canvas + screens -->
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="screens/_shared.jsx"></script>
  <script type="text/babel" src="screens/01-access.jsx"></script>
  <script type="text/babel" src="screens/02-interview.jsx"></script>
  <script type="text/babel" src="screens/03-admin-login.jsx"></script>
  <script type="text/babel" src="screens/04-dashboard.jsx"></script>
  <script type="text/babel" src="screens/05-proposals-list.jsx"></script>
  <script type="text/babel" src="screens/06-proposal-detail.jsx"></script>
  <script type="text/babel" src="screens/07-access-codes.jsx"></script>
  <script type="text/babel" src="screens/08-notifications.jsx"></script>

  <script type="text/babel">
    const { DesignCanvas, DCSection, DCArtboard } = window;
    const {
      ScreenAccess, ScreenInterview, ScreenAdminLogin,
      ScreenDashboard, ScreenProposals, ScreenProposalDetail,
      ScreenAccessCodes, ScreenNotifications,
    } = window;

    const W_DESKTOP = 1440;
    const H_DESKTOP = 900;
    const W_CLIENT  = 1280;
    const H_CLIENT  = 800;

    const Frame = ({ children }) => (
      <div className="artboard-frame">{children}</div>
    );

    function App() {
      return (
        <DesignCanvas>
          <DCSection
            id="cliente"
            title="Área do Cliente"
            subtitle="Acesso público · sem cadastro · validação por código de uso único"
          >
            <DCArtboard id="01-access" label="01 · Acesso" width={W_CLIENT} height={H_CLIENT}>
              <Frame><ScreenAccess /></Frame>
            </DCArtboard>
            <DCArtboard id="02-interview" label="02 · Entrevista (chat com agente)" width={W_CLIENT} height={H_CLIENT}>
              <Frame><ScreenInterview /></Frame>
            </DCArtboard>
          </DCSection>

          <DCSection
            id="admin"
            title="Painel Administrativo"
            subtitle="Acesso protegido · revisão, edição e envio de propostas"
          >
            <DCArtboard id="03-login" label="03 · Login do admin" width={W_CLIENT} height={H_CLIENT}>
              <Frame><ScreenAdminLogin /></Frame>
            </DCArtboard>
            <DCArtboard id="04-dashboard" label="04 · Dashboard" width={W_DESKTOP} height={H_DESKTOP}>
              <Frame><ScreenDashboard /></Frame>
            </DCArtboard>
            <DCArtboard id="05-proposals" label="05 · Lista de propostas" width={W_DESKTOP} height={H_DESKTOP}>
              <Frame><ScreenProposals /></Frame>
            </DCArtboard>
            <DCArtboard id="06-detail" label="06 · Detalhe da proposta" width={W_DESKTOP} height={1280}>
              <Frame><ScreenProposalDetail /></Frame>
            </DCArtboard>
            <DCArtboard id="07-codes" label="07 · Códigos de acesso" width={W_DESKTOP} height={H_DESKTOP}>
              <Frame><ScreenAccessCodes /></Frame>
            </DCArtboard>
            <DCArtboard id="08-notifications" label="08 · Notificações" width={W_DESKTOP} height={H_DESKTOP}>
              <Frame><ScreenNotifications /></Frame>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
